# This is a basic workflow to help you get started with Actions
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  
  # 1. BUILD JOB
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Optional: Upload your build artifact if the deploy job needs it later
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist # Change this to your build output folder (e.g., build, out, dist)

  # 2. TEST JOB
  test:
    runs-on: ubuntu-latest
    needs: build # Ensures tests only run if the build succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # 3. DEPLOY JOB
  deploy:
    runs-on: ubuntu-latest
    needs: test # Ensures deployment only happens if tests pass
    if: github.ref == 'refs/heads/main' # Only deploy when pushing to the main branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: Download the artifact uploaded during the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to production server
        run: |
          echo "Starting production deployment..."
          # Replace these lines with your actual deployment scripts or third-party actions
          # Example: npm run deploy
