name: CI
 
on:

  push:

    branches: [ "main" ]

  pull_request:

    branches: [ "main" ]

  workflow_dispatch:
 
jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
 
      - name: Run a one-line script

        run: echo Hello, world!
 
      - name: Run a multi-line script

        run: |

          echo Add other actions to build,

          echo test, and deploy your project.
 
  change:

    name: Change Request Attributes

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: ServiceNow DevOps Change Attributes

        uses: ServiceNow/servicenow-devops-change@v2.0.0

        with:

          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}

          instance-url: ${{ secrets.SN_INSTANCE_URL }}

          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}

          context-github: ${{ toJSON(github) }}

          job-name: 'Change Request Attributes'

          change-request: '{"setCloseCode":"true","attributes":{"short_description":"Automated Software Deployment"}}'

          interval: '100'

          timeout: '3600'

          deployment-gate: '{"environment":"deploy-gates-demo","jobName":"Deploy"}'
 
  deploy:

    runs-on: ubuntu-latest

    needs: change

    steps:

      - uses: actions/checkout@v4
 
      - name: Run a one-line script

        run: echo Hello, world!
 
      - name: Run a multi-line script

        run: |

          echo Add other actions to build,

          echo test, and deploy your project.

 
