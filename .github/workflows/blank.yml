name: CD GitHub workflow
 
on:
  workflow_run:
    workflows: [ "CI GitHub workflow" ]
    types: [completed]
 
jobs:
  registerPackage:
    name: 'Register Package'
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow DevOps Register Package
        run: echo "Register package complete"
 
  change:
    needs: registerPackage
    runs-on: ubuntu-latest
    name: 'ServiceNow DevOps Change'
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v7.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow DevOps Change'
          change-request: '{"attributes":{"chg_model":{"name":"DevOps"},"requested_by":{"name":"DevOps System"},"assignment_group":{"name":"Change management"},"priority":"2","comments":"This is a sample pipeline scripts to be added in your change step","work_notes":"Update this to work_notes","start_date":"","end_date":""}}'
 
  deploy:
    name: 'Deploy'
    needs: change
    runs-on: ubuntu-latest
    steps:
    - name: Run deployment scripts
      run: echo 'Deployment step in progress...'
